 document.addEventListener('click',function(ev){
  var a=ev.target&&ev.target.closest?ev.target.closest('a[href]'):null;
  if(!a)return;
  var h=a.getAttribute('href')||'';
  if(h.indexOf('http')===0||h.indexOf('blob:')===0||h.indexOf('javascript:')===0||h.charAt(0)==='#'||h.indexOf('mailto:')===0)return;
  if(h.indexOf('assets/')<0)return;
  ev.preventDefault();
  var name=a.getAttribute('download')||h.split('/').pop()||'file';
  name=name.split('?')[0];
  window.__hbDecrypt(h).then(function(buf){
   var u=URL.createObjectURL(new Blob([buf]));
   var d=document.createElement('a');d.href=u;d.download=name;document.body.appendChild(d);d.click();d.remove();
   setTimeout(function(){URL.revokeObjectURL(u)},60000);
  }).catch(function(){});
 },true);
}
